<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" width="100%" height="285" fill="none">
  <defs>
    <style type="text/css"><![CDATA[
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .ghpx-root {
        width: 900px;
        height: 285px;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
        position: relative;
      }
      .mono {
        font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Consolas, monospace;
      }
      
      .wb-wrap {
        width: 100%; height: 100%; padding: 24px 28px;
        display: grid; grid-template-columns: 0.78fr 1.22fr; gap: 24px; align-items: stretch;
      }
      .wb-left {
        background: #16181d; border: 1px solid rgba(242, 239, 230, 0.14); border-radius: 14px;
        padding: 22px; display: flex; flex-direction: column; justify-content: space-between;
      }
      .wb-right {
        display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      }
    
    ]]></style>
    
  </defs>
  
      <rect width="900" height="285" rx="16" fill="#0e0f12" stroke="rgba(242, 239, 230, 0.14)" stroke-width="1.4"/>
    
  <foreignObject x="0" y="0" width="900" height="285">
    <div xmlns="http://www.w3.org/1999/xhtml" class="ghpx-root">
      
      <div class="wb-wrap">
        <div class="wb-left">
          <div class="mono" style="font-size:10.5px; color:#9b998f; letter-spacing:0.08em; text-transform:uppercase;">
            ● ENGINE FOOTPRINT
          </div>
          <div>
            <div style="font-family:'Impact','Anton','Arial Black',sans-serif; font-size:64px; font-weight:900; color:#f2efe6; line-height:0.9; letter-spacing:-1px;">
              23.7 KB
            </div>
            <div class="mono" style="font-size:14px; color:#f2efe6; margin-top:10px;">
              Tiny by nature. Lively by design.
            </div>
            <div style="width:40px; height:3px; background:#d9f55c; margin-top:10px;"></div>
          </div>
          <div class="mono" style="font-size:10px; color:#9b998f;">
            GZIPPED  /  ZERO DEPENDENCIES  /  SHARED WEBGL2 CONTEXT  /  ~1.2 KB / CHARACTER
          </div>
        </div>

        <div class="wb-right">
          
      <div style="background:#16181d; border:1px solid rgba(242, 239, 230, 0.14); border-radius:12px; padding:16px 18px;">
        <div class="mono" style="font-size:12px; font-weight:700; color:#d9f55c; letter-spacing:0.06em; text-transform:uppercase;">
          Real SDF 3D, Not a Sprite
        </div>
        <div style="font-size:12px; color:#f2efe6; opacity:0.85; line-height:1.5; margin-top:6px;">
          Characters are signed-distance 3D with studio softbox lighting, subsurface scattering &amp; spring physics — crisp at any resolution.
        </div>
      </div>
      <div style="background:#16181d; border:1px solid rgba(242, 239, 230, 0.14); border-radius:12px; padding:16px 18px;">
        <div class="mono" style="font-size:12px; font-weight:700; color:#d9f55c; letter-spacing:0.06em; text-transform:uppercase;">
          Characters Are Plain Data
        </div>
        <div style="font-size:12px; color:#f2efe6; opacity:0.85; line-height:1.5; margin-top:6px;">
          Every mascot is declarative JSON — parts, materials, bones. Recolour live with setPalette(), remix with variant(), or generate via agents.
        </div>
      </div>
      <div style="background:#16181d; border:1px solid rgba(242, 239, 230, 0.14); border-radius:12px; padding:16px 18px;">
        <div class="mono" style="font-size:12px; font-weight:700; color:#d9f55c; letter-spacing:0.06em; text-transform:uppercase;">
          Built for Coding Agents
        </div>
        <div style="font-size:12px; color:#f2efe6; opacity:0.85; line-height:1.5; margin-top:6px;">
          Includes Copy-for-Agent prompts on the playground, llms.txt documentation, and an embedded AGENTS.md inside the npm package.
        </div>
      </div>
      <div style="background:#16181d; border:1px solid rgba(242, 239, 230, 0.14); border-radius:12px; padding:16px 18px;">
        <div class="mono" style="font-size:12px; font-weight:700; color:#d9f55c; letter-spacing:0.06em; text-transform:uppercase;">
          Respectful by Default
        </div>
        <div style="font-size:12px; color:#f2efe6; opacity:0.85; line-height:1.5; margin-top:6px;">
          Honours prefers-reduced-motion, automatically sleeps when scrolled off-screen, and shares a single WebGL context across a whole cast.
        </div>
      </div>
        </div>
      </div>
    
    </div>
  </foreignObject>
  
</svg>